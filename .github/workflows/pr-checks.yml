name: PR checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-lock:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tests unchanged after their test commit
        run: python3 .github/scripts/test_lock.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  mutation:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Mutation testing on changed classes
        run: |
          chmod +x ./gradlew
          python3 .github/scripts/mutation_report.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
