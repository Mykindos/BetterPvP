# Settler numbers. Every value is a starting point for balance testing. What exists (professions, traits) is code, how
# much of it is here.

# What each rarity means for a settler. traits: how many it rolls. trait-strength: what its trait effects are multiplied
# by. stats: what its profession stats are multiplied by. trade-off-chance: the chance, from 0 to 1, that each trait it
# rolls is a trade-off.
rarities:
  common: {traits: 1, trait-strength: 1.0, stats: 1.0, trade-off-chance: 0.30}
  uncommon: {traits: 1, trait-strength: 1.25, stats: 1.25, trade-off-chance: 0.25}
  rare: {traits: 2, trait-strength: 1.5, stats: 1.6, trade-off-chance: 0.15}
  legendary: {traits: 3, trait-strength: 2.0, stats: 2.2, trade-off-chance: 0.05}

population:
  # How many settlers a camp can have, by Great Hall stage. A camp without a finished Great Hall can have none.
  by-hall-stage: [6, 12, 20]

# How many settlers of each profession can work at once. by-hall-stage follows the Great Hall like population does.
# per-stage-of adds that many for every stage of a finished structure, so a Workshop at its second stage adds 2.
professions:
  builder:
    by-hall-stage: [2, 3, 4]
    per-stage-of:
      workshop: 1
  farmer:
    by-hall-stage: [2, 2, 2]

# What a Builder brings to a job, by rarity. workforce counts toward a job's threshold. speed is how many times faster
# than its listed time it would run a job alone. efficiency is the share of its speed it adds when it is not the
# fastest on the crew.
builders:
  common: {workforce: 2, speed: 1.0, efficiency: 0.50}
  uncommon: {workforce: 3, speed: 1.25, efficiency: 0.60}
  rare: {workforce: 4, speed: 1.6, efficiency: 0.75}
  legendary: {workforce: 6, speed: 2.2, efficiency: 0.90}

# Builder trades. resource and specialty: extra speed, as a share, on jobs whose cost is mostly that resource.
# workforce: extra Workforce. compatible: trades it works best beside, counting fully on the crew with a bonus.
trades:
  mason: {resource: stone, specialty: 0.5, compatible: [carpenter, smith]}
  carpenter: {resource: wood, specialty: 0.5, compatible: [mason, laborer]}
  smith: {resource: iron, specialty: 0.5, compatible: [mason]}
  laborer: {workforce: 1, compatible: [carpenter]}

# Limits on one job's crew.
crews:
  max-size: 5
  max-speed: 4.0
  compatible-bonus: 0.10
  per-rarity: {rare: 2, legendary: 1}

# How strong each trait is at common rarity. Rarer settlers multiply the good part by their trait-strength, and never
# the cost of a trade-off. Shares are fractions, so 0.15 is 15%.
traits:
  steady_hands: {workforce: 1}
  tireless: {speed: 0.15, min-hours: 2}
  frugal: {refund: 0.05}
  foreman: {crew-speed: 0.10}
  quick_study: {speed-per-five-jobs: 0.05, max-speed: 0.25}
  patcher: {speed: 0.20, refund: 0.20}
  architects_eye: {speed: 0.15}
  loner: {alone: 0.40, in-crew: -0.20}
  greedy: {speed: 0.15, wage: 0.25}
  brawny: {workforce: 2, speed: -0.10}
  prodigy: {stats: 0.25}
  homesick: {stats: 0.10}

# What settlers are paid from the camp's wage fund, in coins an hour, by profession and rarity. Professions not listed
# are not paid. model: 'fixed' pays the fixed rates whatever a settler is doing, 'idle-working' pays the idle rate
# while it waits for work and the working rate while it works. Unpaid settlers strike at once, and leave after
# strike-hours still unpaid.
wages:
  model: fixed
  strike-hours: 72
  fixed:
    builder: {common: 300, uncommon: 600, rare: 1200, legendary: 2500}
  idle-working:
    idle:
      builder: {common: 150, uncommon: 300, rare: 600, legendary: 1250}
    working:
      builder: {common: 450, uncommon: 900, rare: 1800, legendary: 3750}

# Settlers every new camp starts with, so it has a crew for its first jobs.
starting-settlers:
  - {profession: builder, rarity: common}
  - {profession: builder, rarity: common}

# How settlers look. 'default' is used for anything a profession does not set, and for any model or skin that is
# not installed yet, so settlers show up before their own models exist. A profession ('builder', 'farmer', or 'none'
# for settlers without one) overrides it, and its 'rarities' section overrides that again for one rarity.
# model: the ModelEngine model. skin: a blueprint whose bones replace the model's. idle, walk and work: animations,
# where work plays while the settler stands at its workplace. size: how large it is shown.
looks:
  default: {model: scene_market_1, skin: skin_farmer, idle: vendor_stand_2, walk: walk, work: vendor_stand_2, size: 1.0}
  builder:
    skin: settler_builder
    work: work
  farmer:
    skin: settler_farmer
    work: work
  none:
    skin: settler_wanderer
  # The Steward who runs the Great Hall. Not a settler, but looks like one.
  steward:
    skin: settler_steward

