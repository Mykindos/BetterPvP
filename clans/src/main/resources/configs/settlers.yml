# History lines by where a settler came from, as translation keys. {0} in a line is filled in by the source, such as
# the dungeon a prisoner was freed from.
histories:
  starting:
    - clans.settler.history.starting.1
  dock:
    - clans.settler.history.dock.1
    - clans.settler.history.dock.2
  hiring:
    - clans.settler.history.hiring.1
  dungeon:
    - clans.settler.history.dungeon.1
  boss:
    - clans.settler.history.boss.1
  island:
    - clans.settler.history.island.1
  milestone:
    - clans.settler.history.milestone.1
