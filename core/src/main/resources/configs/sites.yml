  lifecycle: ON_DEMAND
  min: 1
  max: 10
  admission: party
  anchorable: false
  rejoin: ANCHOR
  dormancy-grace-seconds: 120

fishing:
  display-name: "Fishing Isle"
  icon: FISHING_ROD
  world:
    clone: "templates/islands/fishing"
  lifecycle: ON_DEMAND
  min: 1
  max: 10
  admission: party
