# What each rank may do in its camp, until a clan changes it. RECRUIT, MEMBER, ADMIN, LEADER, and ALLY for members of
# allied clans. ally-containers is whether allies may open the camp's containers.
permissions:
  LEADER: [BUILD, CANCEL, MOVE, ADVANCE, CLAIM, DEMOLISH, REPAIR, PICK_UPGRADE]
  ADMIN: [BUILD, CANCEL, MOVE, ADVANCE, CLAIM, DEMOLISH, REPAIR, PICK_UPGRADE]
  MEMBER: [BUILD, CLAIM, REPAIR]
  RECRUIT: [CLAIM]
  ALLY: []
  ally-containers: false
  # What each rank may do to the camp's settlers. The leader may always do everything, and allies nothing.
  settlers:
    LEADER: [HIRE, ASSIGN, DISMISS, PAY]
    ADMIN: [HIRE, ASSIGN, DISMISS, PAY]
    MEMBER: [ASSIGN, PAY]
    RECRUIT: [PAY]
