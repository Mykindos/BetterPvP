# Not built yet. Kept here because the catalogue is the design test: if a place cannot be written as a row, the model
# is missing something.
camp:
  display-name: "Camp"
  icon: CAMPFIRE
  world:
    own: "camps/"
  lifecycle: OWNED
  admission: clan
  anchorable: true
  rejoin: RESUME
  rejoin-at: EXACT
  dormancy: UNLOAD_WHEN_EMPTY
  dormancy-grace-seconds: 300
