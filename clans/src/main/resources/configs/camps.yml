# Camp numbers. Everything here is a placeholder until the balance cards settle it.

resources:
  # How much one resource chest holds. A camp's capacity is this times the resource chests its structures have,
  # counted across Wood, Stone and Iron together.
  chest-capacity: 250
  # What a resource is dropped as when a camp holds more than its chests can take, such as after demolishing a
  # structure that had resource chests.
  overflow-item:
    wood: "minecraft:oak_log"
    stone: "minecraft:cobblestone"
    iron: "minecraft:iron_ingot"

# What each item is worth when deposited, by item key. Vanilla items are "minecraft:<material>", custom items use
# their own key. Items not listed here stay in the player's inventory.
deposit:
  wood:
    "minecraft:oak_log": 1
    "minecraft:spruce_log": 1
    "minecraft:birch_log": 1
    "minecraft:jungle_log": 1
    "minecraft:acacia_log": 1
    "minecraft:dark_oak_log": 1
    "minecraft:mangrove_log": 1
    "minecraft:cherry_log": 1
  stone:
    "minecraft:cobblestone": 1
    "minecraft:stone": 1
    "minecraft:deepslate": 1
    "minecraft:cobbled_deepslate": 1
  iron:
    "minecraft:raw_iron": 1
    "minecraft:iron_ingot": 1

construction:
  # How many of a structure's top layers wait for the claim, then animate in.
  claim-layers: 3

# The numbers for each structure. What a structure is (its tier, what it needs, whether it can move or be demolished)
# is code. Each stage names the structure build it uses, what it costs and how long it takes. Stages run in order,
# the first being what building it produces. Times are in seconds. workforce is how much Workforce a crew of Builders
# needs for the job that takes the structure to that stage. Repairs and moves need half the stage it stands at.
structures:
  great_hall:
    icon: BELL
    stages:
      - schematic: camps/great_hall_1
        cost: {}
        build-seconds: 0
        workforce: 2
      - schematic: camps/great_hall_2
        cost: {wood: 400, stone: 300, iron: 50}
        build-seconds: 3600
        workforce: 5
      - schematic: camps/great_hall_3
        cost: {wood: 900, stone: 800, iron: 200}
        build-seconds: 10800
        workforce: 8
    move: {cost: {}, seconds: 0}
    repair: {cost: {wood: 50, stone: 50}, seconds: 300}
  barracks:
    icon: RED_BED
    stages:
      - schematic: camps/barracks_1
        cost: {wood: 100, stone: 50}
        build-seconds: 600
        workforce: 2
    move: {cost: {}, seconds: 0}
    repair: {cost: {wood: 30}, seconds: 180}
  dock:
    icon: OAK_BOAT
    stages:
      - schematic: camps/dock_1
        cost: {}
        build-seconds: 0
        workforce: 2
    repair: {cost: {wood: 60}, seconds: 300}
  workshop:
    icon: CRAFTING_TABLE
    stages:
      - schematic: camps/workshop_1
        cost: {wood: 150, stone: 100}
        build-seconds: 1200
        workforce: 2
    move: {cost: {}, seconds: 0}
    repair: {cost: {wood: 40}, seconds: 180}
    demolish-refund: 0.0
  storehouse:
    icon: CHEST
    stages:
      - schematic: camps/storehouse_1
        cost: {wood: 120, stone: 60}
        build-seconds: 900
        workforce: 2
    move: {cost: {}, seconds: 0}
    repair: {cost: {wood: 40}, seconds: 180}
    demolish-refund: 0.0

# What each rank may do in its camp, until a clan changes it. RECRUIT, MEMBER, ADMIN, LEADER, and ALLY for members of
# allied clans. ally-containers is whether allies may open the camp's containers.
permissions:
  LEADER: [BUILD, CANCEL, MOVE, ADVANCE, CLAIM, DEMOLISH, REPAIR]
  ADMIN: [BUILD, CANCEL, MOVE, ADVANCE, CLAIM, DEMOLISH, REPAIR]
  MEMBER: [BUILD, CLAIM, REPAIR]
  RECRUIT: [CLAIM]
  ALLY: []
  ally-containers: false
  # What each rank may do to the camp's settlers. The leader may always do everything, and allies nothing.
  settlers:
    LEADER: [HIRE, ASSIGN, DISMISS, PAY]
    ADMIN: [HIRE, ASSIGN, DISMISS, PAY]
    MEMBER: [ASSIGN, PAY]
    RECRUIT: [PAY]
