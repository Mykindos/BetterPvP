# Camp numbers. Everything here is a placeholder until the balance cards settle it.

resources:
  # How much one resource chest holds. A camp's capacity is this times the resource chests its structures have,
  # counted across Wood, Stone and Iron together.
  chest-capacity: 250
  # What a resource is dropped as when a camp holds more than its chests can take, such as after demolishing a
  # structure that had resource chests.
  overflow-item:
    wood: "minecraft:oak_log"
    stone: "minecraft:cobblestone"
    iron: "minecraft:iron_ingot"

# What each item is worth when deposited, by item key. Vanilla items are "minecraft:<material>", custom items use
# their own key. Items not listed here stay in the player's inventory.
deposit:
  wood:
    "minecraft:oak_log": 1
    "minecraft:spruce_log": 1
    "minecraft:birch_log": 1
    "minecraft:jungle_log": 1
    "minecraft:acacia_log": 1
    "minecraft:dark_oak_log": 1
    "minecraft:mangrove_log": 1
    "minecraft:cherry_log": 1
  stone:
    "minecraft:cobblestone": 1
    "minecraft:stone": 1
    "minecraft:deepslate": 1
    "minecraft:cobbled_deepslate": 1
  iron:
    "minecraft:raw_iron": 1
    "minecraft:iron_ingot": 1

# The numbers for each structure. What a structure is (its tier, what it needs, whether it can move or be demolished)
# is code. Each stage names the structure build it uses, what it costs and how long it takes. Stages run in order,
# the first being what building it produces. Times are in seconds. workforce is how much Workforce a crew of Builders
# needs for the job that takes the structure to that stage. Repairs and moves need half the stage it stands at.
#
# upgrades holds the numbers for each upgrade the structure offers. Which upgrades exist, and at which stage, is code.
# cost and seconds are what fitting it takes (0 seconds fits it at once), workforce is what a crew needs to fit it,
# piece is the build placed on the "upgrade:<id>" point in the structure's build, and settings are the upgrade's own.
structures:
  great_hall:
    icon: BELL
    stages:
      - schematic: camps/great_hall_1
        cost: {}
        build-seconds: 0
        workforce: 2
      - schematic: camps/great_hall_2
        cost: {wood: 400, stone: 300, iron: 50}
        build-seconds: 3600
        workforce: 5
      - schematic: camps/great_hall_3
        cost: {wood: 900, stone: 800, iron: 200}
        build-seconds: 10800
        workforce: 8
    move: {cost: {}, seconds: 0}
    repair: {cost: {wood: 50, stone: 50}, seconds: 300}
    upgrades:
      standing_orders:
        icon: BOOK
        cost: {wood: 120, stone: 60}
        seconds: 900
        workforce: 2
        piece: camps/upgrades/standing_orders
      guest_quarters:
        icon: WHITE_BED
        cost: {wood: 300, stone: 150}
        seconds: 1800
        workforce: 4
        piece: camps/upgrades/guest_quarters
      wage_policy:
        icon: GOLD_NUGGET
        cost: {wood: 200, stone: 100, iron: 40}
        seconds: 1800
        workforce: 4
        piece: camps/upgrades/wage_policy
        settings:
          # The most coins one member pays toward wages in a real day.
          daily-cap: 500
      camp_ledger:
        icon: WRITABLE_BOOK
        cost: {wood: 80, stone: 40}
        seconds: 600
        workforce: 2
        piece: camps/upgrades/camp_ledger
        settings:
          # How many entries a camp keeps, the oldest dropped first.
          max-entries: 200
      rival_board:
        icon: WHITE_BANNER
        cost: {wood: 500, stone: 400, iron: 100}
        seconds: 3600
        workforce: 6
        piece: camps/upgrades/rival_board
        settings:
          # How many camps ranked just above and just below this one the board shows.
          above: 5
          below: 5
      deputy_steward:
        icon: ARMOR_STAND
        cost: {wood: 600, stone: 500, iron: 150}
        seconds: 3600
        workforce: 6
        piece: camps/upgrades/deputy_steward
      feast_table:
        icon: CAKE
        cost: {wood: 100, stone: 40}
        seconds: 600
        workforce: 2
        piece: camps/upgrades/feast_table
        settings:
          # Food points one feast takes, how long it lasts and the morale it gives every settler meanwhile.
          cost: 320
          hours: 24
          morale: 15
          # What each item is worth toward a feast, by item key.
          food:
            "minecraft:bread": 5
            "minecraft:baked_potato": 5
            "minecraft:cooked_cod": 5
            "minecraft:cooked_salmon": 6
            "minecraft:cooked_chicken": 6
            "minecraft:cooked_mutton": 6
            "minecraft:cooked_porkchop": 8
            "minecraft:cooked_beef": 8
            "minecraft:pumpkin_pie": 8
      prosperity_breakdown:
        icon: EMERALD
        cost: {wood: 250, stone: 150}
        seconds: 1800
        workforce: 3
        piece: camps/upgrades/prosperity_breakdown
      great_bell:
        icon: BELL
        cost: {wood: 300, stone: 200, iron: 80}
        seconds: 2700
        workforce: 5
        piece: camps/upgrades/great_bell
        settings:
          # How long a camp waits between rings.
          cooldown-hours: 24
          # The morale every settler gets from a ring, and for how many minutes.
          morale: 10
          minutes: 120
  barracks:
    icon: RED_BED
    stages:
      - schematic: camps/barracks_1
        cost: {wood: 100, stone: 50}
        build-seconds: 600
        workforce: 2
      - schematic: camps/barracks_2
        cost: {wood: 200, stone: 100, iron: 30}
        build-seconds: 1200
        workforce: 4
      - schematic: camps/barracks_3
        cost: {wood: 400, stone: 225, iron: 90}
        build-seconds: 2700
        workforce: 6
    move: {cost: {}, seconds: 0}
    repair: {cost: {wood: 30}, seconds: 180}
    upgrades:
      supply_crate:
        icon: BARREL
        cost: {wood: 60}
        seconds: 300
