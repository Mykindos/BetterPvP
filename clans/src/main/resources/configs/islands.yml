# Discovery island templates. Each top-level key is the template's id, cloned by IslandWorldProvisioner to spawn a
# fresh IslandInstance.
#
# display-name      : shown to players
# template-folder   : path of the template world folder, relative to the Bukkit world container
# icon              : Material used to represent this island in menus
#
# Islands are reached by ship, from a helm's navigator, so each also has a crossing (see voyages.yml for the same
# knobs). Anything left out takes the default crossing.
#
# min-seconds       : no landfall roll happens before this
# max-seconds       : landfall is certain by this, however the rolls go
# chance            : odds of each roll landing, once past min-seconds (rolled every 10s)

mining:
  display-name: "Mining Isle"
  template-folder: "templates/islands/mining"
  icon: IRON_PICKAXE

woodcutting:
  display-name: "Woodcutting Isle"
  template-folder: "templates/islands/woodcutting"
  icon: OAK_LOG

fishing:
  display-name: "Fishing Isle"
  template-folder: "templates/islands/fishing"
  icon: FISHING_ROD

# The open ocean a crew crosses between docks. One instance per voyage, released on arrival.
#
# Not reachable from the navigator - it is allocated by VoyageService, never offered. The template world holds nothing
# but water and a single `ship_berth`; the vessel itself is pasted in from the structure that berth names, so one
# template serves every ship.
limbo:
  display-name: "The Open Sea"
  template-folder: "templates/islands/limbo"
  icon: WATER_BUCKET
